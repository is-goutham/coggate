# CogGate — continuous integration.
#
# EN: Runs the repository's existing local checks (pytest + strict mypy) on
#     every pull request and push to main, across the supported Python
#     versions. Kept intentionally small and least-privileged.
# FR: Exécute les vérifications locales du dépôt (pytest + mypy strict) sur
#     chaque pull request et push vers main, sur les versions Python
#     supportées. Volontairement minimal et aux moindres privilèges.

name: CI

# EN: Least-privilege — these jobs only need to read the repository.
# FR: Moindre privilège — ces jobs n'ont besoin que de lire le dépôt.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# EN: If a new commit lands on the same PR, drop the in-flight run.
# FR: Si un nouveau commit arrive sur la même PR, abandonner la run en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python-${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run strict mypy
        run: python -m mypy function_app.py src tests
